modules:
  macro:
    - key: used-in-macro
      resource: main
      resolver:
        function: backend-resolver
      render: native
      title: Used In
      description: Lists pages where this component or material is referenced
  function:
    - key: backend-resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/5817461e-7aee-4061-9ff3-765d0375b87c
permissions:
  scopes:
    - search:confluence
    - read:confluence-content.summary
    - read:page:confluence